[project]
name = "brute"
version = "0.1.0"
description = "Rude and mental harness. A brute, not a gent."
authors = [
    { name = "blitterated", email = "blitterated@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.3.0",
    "openai>=3.19.2",
]

[project.scripts]
brute = "brute.brute:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
# Stops suppression of STDOUT.
addopts = "-s"

# Top level dir of tests.
# Prevents "ImportError: attempted relative import with no known parent package".
testpaths = ["tests"]

# Prevents "ModuleNotFoundError: No module named 'foo.bar.baz'".
pythonpath = ["."]
